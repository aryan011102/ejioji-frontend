workflows:
  # TestFlight build, started by hand from Codemagic. Adapted from Buddy's
  # ios-internal-testflight: same team, same App Store Connect integration and
  # distribution certificate, none of Buddy's Firebase, Maps or Razorpay.
  #
  # Environment group theonebytwo_secrets:
  #   CERT_PRIVATE_KEY   base64 of the distribution certificate's private key
  #                      (the same value as Buddy's: the certificate is the team's)
  #   APP_STORE_APP_ID   the app's Apple ID number (App Store Connect, App Information)
  #   API_BASE_URL       the backend, https only (the Railway test server for now)
  #   FCM_PROJECT_ID     Firebase project id ("theonebytwo")
  #   FCM_SENDER_ID      Firebase sender id, the project number
  #   FCM_IOS_APP_ID     GOOGLE_APP_ID from GoogleService-Info.plist
  #   FCM_IOS_API_KEY    API_KEY from the same file
  #   REVENUECAT_IOS_KEY RevenueCat's public Apple key (appl_...), for buying
  #                      Premium. Not a secret; unset means buying is off.
  #
  # The four FCM values are not secrets (every app ships them), but they are not
  # in the repository either: GoogleService-Info.plist is gitignored, and this
  # build never needs the file itself. Leave them unset and the build still
  # works, with push off.
  #
  # The bundle ID com.theonebytwo.app must already be registered with the
  # Associated Domains capability, or the profile made here will not carry
  # Runner.entitlements and signing fails.
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: App Store Connect
    environment:
      groups:
        - theonebytwo_secrets
      flutter: stable
      xcode: 26.0
      cocoapods: default
    scripts:
      - name: Write build configuration from secrets
        script: |
          set -e
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "ERROR: API_BASE_URL must be set and start with https://"; exit 1 ;;
          esac
          # Staging, not prod: prod requires CERT_PINS, and the test server's
          # certificate is not pinned.
          cat > "$CM_BUILD_DIR/config/testflight.json" <<EOF
          {
            "FLAVOR": "staging",
            "API_BASE_URL": "$API_BASE_URL",
            "CERT_PINS": "",
            "FCM_PROJECT_ID": "$FCM_PROJECT_ID",
            "FCM_SENDER_ID": "$FCM_SENDER_ID",
            "FCM_IOS_APP_ID": "$FCM_IOS_APP_ID",
            "FCM_IOS_API_KEY": "$FCM_IOS_API_KEY",
            "REVENUECAT_IOS_KEY": "$REVENUECAT_IOS_KEY"
          }
          EOF
          # Not fatal: a build with push off is a valid build, and a silent one
          # is worse than a noisy one.
          test -n "$FCM_IOS_APP_ID" || echo "WARNING: no FCM_IOS_APP_ID. This build cannot receive notifications."
          test -n "$REVENUECAT_IOS_KEY" || echo "WARNING: no REVENUECAT_IOS_KEY. This build cannot buy Premium."
      - name: Register the URL scheme Firebase phone sign-in returns through
        script: |
          set -e
          # When Firebase cannot prove the app with a silent push, it falls back to
          # a captcha in Safari and comes back through a URL scheme made from the
          # iOS app id ("1:123:ios:abc" becomes "app-1-123-ios-abc"). Without it
          # the app crashes at that point. Written here because the app id is a
          # build secret, not a file in the repository.
          if [ -z "$FCM_IOS_APP_ID" ]; then
            echo "No FCM_IOS_APP_ID: Firebase is off in this build, no scheme needed."
            exit 0
          fi
          PLIST="$CM_BUILD_DIR/ios/Runner/Info.plist"
          SCHEME="app-$(echo "$FCM_IOS_APP_ID" | tr ':' '-')"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" 2>/dev/null || true
          N=$(/usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST" | grep -c "Dict {" || true)
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:$N dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:$N:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:$N:CFBundleURLSchemes:0 string $SCHEME" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes" "$PLIST"
      - name: Point the push entitlement at production APNs
        script: |
          set -e
          # Runner.entitlements carries `development`, which is what a debug
          # build on a cable needs. Anything signed for the App Store, TestFlight
          # included, talks to production APNs instead, and a mismatch here is a
          # build that installs and then never receives a push.
          /usr/libexec/PlistBuddy -c "Set :aps-environment production" "$CM_BUILD_DIR/ios/Runner/Runner.entitlements"
          /usr/libexec/PlistBuddy -c "Print :aps-environment" "$CM_BUILD_DIR/ios/Runner/Runner.entitlements"
      - name: Restore signing certificate private key
        script: |
          mkdir -p ~/private_keys
          echo "$CERT_PRIVATE_KEY" | base64 --decode > ~/private_keys/cert_key.pem
          # sanity check: fails fast if the secret was pasted wrapped or malformed
          openssl rsa -in ~/private_keys/cert_key.pem -check -noout
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Fetch / create signing files
        script: |
          app-store-connect fetch-signing-files "com.theonebytwo.app" \
            --type=IOS_APP_STORE \
            --certificate-key=@file:$HOME/private_keys/cert_key.pem \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          cd $CM_BUILD_DIR
          flutter pub get
      - name: Generate Flutter iOS config
        script: |
          cd $CM_BUILD_DIR
          flutter build ios --config-only --no-codesign \
            --dart-define-from-file=config/testflight.json
      - name: Pod install
        script: |
          cd $CM_BUILD_DIR/ios
          pod install --repo-update
      - name: Set build number
        script: |
          set -e
          test -n "$APP_STORE_APP_ID" || { echo "ERROR: APP_STORE_APP_ID is not set"; exit 1; }
          cd $CM_BUILD_DIR
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          BUILD_NUMBER=$((LATEST + 1))
          echo "Using build number: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
      - name: Build IPA
        script: |
          cd $CM_BUILD_DIR
          # build name (CFBundleShortVersionString) comes from pubspec.yaml
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define-from-file=config/testflight.json \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:    # uncomment + add group name once testers are added
        #   - Team

  # Google Play build, started by hand from Codemagic. On the same Mac as iOS:
  # nothing here needs one, but Linux machines are not on this account's
  # billing plan ("The selected instance type is not available").
  #
  # Also from theonebytwo_secrets: API_BASE_URL, FCM_PROJECT_ID, FCM_SENDER_ID
  # (shared with iOS), plus
  #   FCM_ANDROID_APP_ID  mobilesdk_app_id from google-services.json, for the
  #                       Android app com.theonebytwo.app in the same Firebase
  #                       project
  #   FCM_ANDROID_API_KEY current_key from the same file
  #   REVENUECAT_ANDROID_KEY
  #                       RevenueCat's public Google key (goog_...), from the
  #                       Play Store app under Apps in RevenueCat, for buying
  #                       Premium. Not a secret; unset means buying is off.
  #   GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
  #                       the JSON key of a Google Cloud service account that
  #                       Play Console (Users and permissions) lets release
  #                       apps. Only needed once publishing below is turned on.
  #
  # The upload keystore is a code signing identity (Settings, Code signing
  # identities, Android keystores) with the reference name below.
  # Keep a copy of the .jks and its passwords outside Codemagic too.
  #
  # Google Play takes no upload through its API until the app has one release,
  # so the first .aab is downloaded from this build's artifacts and uploaded by
  # hand in Play Console. After that, uncomment publishing.
  android-play:
    name: Android Google Play
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - theonebytwo_secrets
      android_signing:
        - theonebytwo_upload
      # Pinned, not stable: newer Flutter refuses Gradle below 9.3.1 and this
      # project is on 8.14 (android/gradle/wrapper). Move both together.
      flutter: 3.41.2
      java: 17
      vars:
        PACKAGE_NAME: "com.theonebytwo.app"
    scripts:
      - name: Check the upload key is here
        script: |
          set -e
          # Without it Gradle falls back to the debug key, and Play refuses the
          # upload only after the whole build. Stop now instead.
          test -n "$CM_KEYSTORE_PATH" || { echo "ERROR: no keystore. Add theonebytwo_upload under Team settings, Code signing identities."; exit 1; }
          # The upload key's fingerprints, not secret: the SHA-1 and SHA-256 go
          # into Firebase (phone sign-in), the SHA-256 into the site's
          # .well-known/assetlinks.json (the Google sign-in return link), each
          # next to Play's own app signing key from Play Console, App integrity.
          keytool -list -v -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" | grep -E "SHA1|SHA256"
      - name: Write build configuration from secrets
        script: |
          set -e
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "ERROR: API_BASE_URL must be set and start with https://"; exit 1 ;;
          esac
          # Staging, as on iOS: prod requires CERT_PINS, and the test server's
          # certificate is not pinned.
          cat > "$CM_BUILD_DIR/config/play.json" <<JSON
          {
            "FLAVOR": "staging",
            "API_BASE_URL": "$API_BASE_URL",
            "CERT_PINS": "",
            "FCM_PROJECT_ID": "$FCM_PROJECT_ID",
            "FCM_SENDER_ID": "$FCM_SENDER_ID",
            "FCM_ANDROID_APP_ID": "$FCM_ANDROID_APP_ID",
            "FCM_ANDROID_API_KEY": "$FCM_ANDROID_API_KEY",
            "REVENUECAT_ANDROID_KEY": "$REVENUECAT_ANDROID_KEY"
          }
          JSON
          test -n "$FCM_ANDROID_APP_ID" || echo "WARNING: no FCM_ANDROID_APP_ID. This build cannot receive notifications."
          test -n "$REVENUECAT_ANDROID_KEY" || echo "WARNING: no REVENUECAT_ANDROID_KEY. This build cannot buy Premium."
      - name: Point Gradle at Codemagic's Flutter
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          cd $CM_BUILD_DIR
          flutter pub get
      - name: Set build number
        script: |
          set -e
          # One more than the highest Play has seen, once Play can be asked.
          # Before that (no service account, or no release yet) Codemagic's own
          # count for this workflow, which only goes up. The larger of the two,
          # so a hand-uploaded build is never repeated.
          LATEST=0
          if [ -n "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" ]; then
            LATEST=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" 2>/dev/null || echo 0)
          fi
          NEXT=$((LATEST + 1))
          if [ "$BUILD_NUMBER" -gt "$NEXT" ]; then NEXT=$BUILD_NUMBER; fi
          echo "Using build number: $NEXT"
          echo "PLAY_BUILD_NUMBER=$NEXT" >> $CM_ENV
      - name: Build AAB
        script: |
          cd $CM_BUILD_DIR
          # build name (versionName) comes from pubspec.yaml
          flutter build appbundle --release \
            --build-number=$PLAY_BUILD_NUMBER \
            --dart-define-from-file=config/play.json
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
      - flutter_drive.log
    # Uncomment once the first .aab is in Play Console and
    # GCLOUD_SERVICE_ACCOUNT_CREDENTIALS is set. "alpha" is Play's name for
    # closed testing, the track the 12 testers for 14 days run on; "internal"
    # for the team only. As a draft while the app has never been published,
    # since Play refuses anything else then; roll it out in Play Console.
    # publishing:
    #   google_play:
    #     credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
    #     track: alpha
    #     submit_as_draft: true
