name: ejioji
description: ejioji — a profile built from what you already did.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State. Riverpod over Provider/Bloc here because most of this app is
  # read-a-thing-and-show-it, and Riverpod's async providers cover loading,
  # error and data without a bespoke state class per screen.
  flutter_riverpod: ^2.5.1

  # Routing. Declarative, deep-linkable, and it gives us one place to enforce
  # the auth and verification redirects rather than scattering guards.
  go_router: ^14.2.7

  # Networking.
  dio: ^5.7.0

  # Tokens never touch SharedPreferences. Keychain on iOS, EncryptedSharedPrefs
  # on Android.
  flutter_secure_storage: ^9.2.2

  # Non-sensitive, non-secret preferences only (last tab, seen-onboarding).
  shared_preferences: ^2.3.2

  # Photos. The picker returns bytes we hand straight to a signed blob URL;
  # the file never passes through our own API.
  image_picker: ^1.1.2

  # Video behind a tile plays in the tile itself, muted until tapped. The
  # first-party player; nothing else here needs one.
  video_player: ^2.9.2

  # Opening the provider's consent page in the system browser, never a WebView.
  # A WebView we control must not see somebody's Google password.
  url_launcher: ^6.3.0

  # The system share sheet, for a shared-profile link: most families will get
  # it on WhatsApp, and the sheet is how a link reaches WhatsApp.
  share_plus: ^12.0.2

  # Receiving the OAuth redirect back. The provider sends the browser to an
  # App Link / Universal Link and this is how the app hears about it.
  app_links: ^6.3.2

  # Reading the Netflix viewing-history CSV the person downloaded.
  file_picker: ^8.1.2

  # Push notifications. firebase_core is the platform handshake and
  # firebase_messaging is the token and the messages; nothing else Firebase
  # offers is used, and no analytics SDK is here on purpose. Both stay asleep
  # unless the FCM_* defines are set, so a build without a Firebase project
  # (and every web build) runs exactly as it did before.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

  equatable: ^2.0.5

  # This build's version and build number (Codemagic stamps the TestFlight
  # one), for the foot of Settings and for feedback, so a bug report can be
  # matched to the build it came from.
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Generates every launcher icon size from assets/branding. Run after changing
  # those images: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  # The logo as sent, on black. iOS rounds the corners itself, and the App Store
  # refuses an icon with transparency, hence remove_alpha_ios.
  image_path: assets/branding/icon.png
  ios: true
  remove_alpha_ios: true
  android: ic_launcher
  # Android 8+ masks icons to whatever shape the launcher likes (circle,
  # squircle), so the logo sits smaller, centred inside the safe area, on black.
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  # The foreground image already keeps the logo inside the safe area.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

flutter:
  uses-material-design: true

  # Google Sans is licensed and is NOT redistributable — it is not checked in.
  # On Android the app asks for it by name and falls back to Roboto when it is
  # absent, which is the correct behaviour on a stock device. If your build has
  # a licensed copy, drop the files in and uncomment this block.
  #
  # fonts:
  #   - family: Google Sans
  #     fonts:
  #       - asset: assets/fonts/GoogleSans-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/GoogleSans-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/GoogleSans-Bold.ttf
  #         weight: 700
